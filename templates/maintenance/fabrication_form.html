{% extends "base.html" %}

{% block title %}Fabricar Cabo{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        padding: 16px;
        padding-bottom: 100px;
        background: #0a0a0a;
        min-height: 100vh;
    }

    .page-header {
        margin-bottom: 24px;
    }

    .page-title {
        color: #f5f5f5;
        font-size: 1.3rem;
        font-weight: 600;
    }

    .form-card {
        background: #1a1a1a;
        border-radius: 12px;
        padding: 20px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-label {
        display: block;
        color: #888;
        font-size: 0.85rem;
        margin-bottom: 6px;
    }

    .form-control {
        width: 100%;
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
        color: #f5f5f5;
        font-size: 1rem;
    }

    .form-control:focus {
        outline: none;
        border-color: #455a64;
    }

    .form-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .btn-submit {
        width: 100%;
        background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 16px;
    }

    .btn-cancel {
        width: 100%;
        background: #333;
        color: #888;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 1rem;
        margin-top: 8px;
        text-decoration: none;
        display: block;
        text-align: center;
    }

    .info-box {
        background: #252525;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        border-left: 3px solid #455a64;
    }

    .info-box h4 {
        color: #f5f5f5;
        font-size: 0.9rem;
        margin-bottom: 8px;
    }

    .info-box p {
        color: #888;
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-hammer"></i> Fabricar Cabo
        </h1>
    </div>

    <div class="info-box">
        <h4><i class="fas fa-info-circle"></i> Como funciona</h4>
        <p>Ao fabricar, o sistema consome materiais do estoque e cria automaticamente o equipamento no Hardcase com QR Code.</p>
    </div>

    <form method="POST" class="form-card">
        <div class="form-group">
            <label class="form-label">Tipo de Cabo *</label>
            <select name="cable_type" class="form-control" required>
                <option value="xlr_mf">Cabo XLR M/F</option>
                <option value="xlr_mm">Cabo XLR M/M</option>
                <option value="p10_mono">Cabo P10 Mono</option>
                <option value="p10_stereo">Cabo P10 Stereo</option>
                <option value="powercon">Cabo Powercon</option>
                <option value="dmx">Cabo DMX 5 pinos</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Comprimento (metros) *</label>
                <input type="number" name="length" class="form-control" value="5" min="0.5" step="0.5" required>
            </div>
            <div class="form-group">
                <label class="form-label">Quantidade *</label>
                <input type="number" name="quantity" class="form-control" value="1" min="1" max="50" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fas fa-hammer"></i> Fabricar e Adicionar ao Hardcase
        </button>
        
        <a href="{{ url_for('maintenance.fabrication') }}" class="btn-cancel">Cancelar</a>
    </form>
</div>
{% endblock %}
