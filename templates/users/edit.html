{% extends "base.html" %}

{% block title %}Editar Usuário{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <h2 class="text-white mb-4">
        <i class="bi bi-person-gear"></i> Editar Usuário
    </h2>

    <div class="card bg-dark border-secondary">
        <div class="card-body">
            <form method="POST" action="{{ url_for('users.edit', id=user.id) }}">
                <div class="mb-3">
                    <label class="form-label text-white">Nome *</label>
                    <input type="text" name="name" class="form-control bg-dark text-white border-secondary" value="{{ user.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Email</label>
                    <input type="email" class="form-control bg-dark text-white border-secondary" value="{{ user.email }}" disabled>
                    <small class="text-muted">Email não pode ser alterado</small>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Telefone</label>
                    <input type="tel" name="phone" class="form-control bg-dark text-white border-secondary" value="{{ user.phone or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label text-white">Nova Senha</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" minlength="6">
                    <small class="text-muted">Deixe em branco para manter a senha atual</small>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white">Tipo de Usuário *</label>
                    <select name="role" class="form-select bg-dark text-white border-secondary">
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrador</option>
                        <option value="tech_responsible" {% if user.role == 'tech_responsible' %}selected{% endif %}>Técnico Responsável</option>
                        <option value="tech_tour" {% if user.role == 'tech_tour' %}selected{% endif %}>Técnico Tour</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Salvar
                    </button>
                    <a href="{{ url_for('users.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
