<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TOUR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid #2a2a2a;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-title {
            font-size: 48px;
            font-weight: 700;
            color: #f5f5f5;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: #a0a0a0;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a0a;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            color: #f5f5f5;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
        }

        .form-input::placeholder {
            color: #505050;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #cd7f32 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212,175,55,0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 32px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #2a2a2a;
        }

        .divider span {
            background: #1a1a1a;
            padding: 0 16px;
            color: #707070;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .register-link {
            text-align: center;
        }

        .register-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .register-link a:hover {
            color: #b8941f;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-danger {
            background: rgba(231,76,60,0.2);
            border-left: 4px solid #e74c3c;
            color: #e74c3c;
        }

        .user-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
            padding: 16px;
            background: #0d0d0d;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .user-type {
            text-align: center;
            padding: 12px 8px;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
        }

        .user-type-icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .user-type-admin .user-type-icon { color: #d4af37; }
        .user-type-tech .user-type-icon { color: #3498db; }
        .user-type-tour .user-type-icon { color: #2ecc71; }

        .user-type-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-types-label {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            .logo-title {
                font-size: 40px;
            }

            .user-types {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 12px;
            }

            .user-type {
                padding: 10px 6px;
            }

            .user-type-icon {
                font-size: 1.2rem;
            }

            .user-type-name {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="login-card">
            <div class="logo-section">
                <div class="logo-title">TOUR</div>
                <div class="logo-subtitle">Gestão de Equipamentos e Logística</div>
            </div>

            <div class="user-types-label">Acesso para</div>
            <div class="user-types">
                <div class="user-type user-type-admin">
                    <div class="user-type-icon"><i class="fas fa-crown"></i></div>
                    <div class="user-type-name">Admin</div>
                </div>
                <div class="user-type user-type-tech">
                    <div class="user-type-icon"><i class="fas fa-wrench"></i></div>
                    <div class="user-type-name">Técnico</div>
                </div>
                <div class="user-type user-type-tour">
                    <div class="user-type-icon"><i class="fas fa-qrcode"></i></div>
                    <div class="user-type-name">Tour</div>
                </div>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="seu@email.com" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>
            </form>

            <div class="divider">
                <span>Não tem conta?</span>
            </div>

            <div class="register-link">
                <a href="{{ url_for('auth.register') }}">Criar conta</a>
            </div>
        </div>
    </div>
</body>
</html>
