{% extends "base.html" %}

{% block title %}Login - TOUR{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--spacing-md);
    }

    .login-card {
        background-color: var(--bg-secondary);
        border-radius: var(--radius-lg);
        padding: var(--spacing-xl);
        width: 100%;
        max-width: 440px;
        box-shadow: var(--shadow-lg);
    }

    .login-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
    }

    .login-logo {
        font-family: var(--font-display);
        font-size: 3rem;
        font-weight: var(--font-weight-semibold);
        color: var(--text-primary);
        margin-bottom: var(--spacing-xs);
        letter-spacing: 0.1em;
    }

    .login-subtitle {
        font-family: var(--font-body);
        font-size: 0.95rem;
        font-weight: var(--font-weight-light);
        color: var(--text-secondary);
        letter-spacing: 0.05em;
    }

    .login-form {
        margin-bottom: var(--spacing-lg);
    }

    .login-footer {
        text-align: center;
        padding-top: var(--spacing-md);
        border-top: 1px solid var(--border-subtle);
    }

    .login-footer a {
        color: var(--accent-gold);
        text-decoration: none;
        font-weight: var(--font-weight-medium);
    }

    .login-footer a:hover {
        color: var(--accent-gold-hover);
    }

    @media (max-width: 480px) {
        .login-logo {
            font-size: 2.5rem;
        }

        .login-card {
            padding: var(--spacing-lg);
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-logo">TOUR</h1>
            <p class="login-subtitle">Gestão de Equipamentos e Logística</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input 
                    type="email" 
                    id="email"
                    name="email" 
                    class="form-control"
                    placeholder="seu@email.com"
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    class="form-control"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Entrar
            </button>
        </form>

        <div class="login-footer">
            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-xs);">
                Não tem conta?
            </p>
            <a href="{{ url_for('auth.register') }}">Criar conta</a>
        </div>
    </div>
</div>
{% endblock %}
