{% extends "base.html" %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <h1 style="margin-bottom: 30px;">Dashboard</h1>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">

        <a href="{{ url_for('equipment.list_equipment') }}" style="text-decoration: none; color: inherit;">
            <div style="background: #007bff; color: white; padding: 30px; border-radius: 10px; text-align: center; transition: transform 0.2s;"
                 onmouseover="this.style.transform='translateY(-5px)'" 
                 onmouseout="this.style.transform='translateY(0)'">
                <h2 style="margin: 0; font-size: 36px;">🎤</h2>
                <h3 style="margin: 10px 0 0 0;">Equipamentos</h3>
            </div>
        </a>

        <a href="{{ url_for('kit.list_kits') }}" style="text-decoration: none; color: inherit;">
            <div style="background: #28a745; color: white; padding: 30px; border-radius: 10px; text-align: center; transition: transform 0.2s;"
                 onmouseover="this.style.transform='translateY(-5px)'" 
                 onmouseout="this.style.transform='translateY(0)'">
                <h2 style="margin: 0; font-size: 36px;">📦</h2>
                <h3 style="margin: 10px 0 0 0;">Kits</h3>
            </div>
        </a>

        <a href="{{ url_for('tour.list_tours') }}" style="text-decoration: none; color: inherit;">
            <div style="background: #dc3545; color: white; padding: 30px; border-radius: 10px; text-align: center; transition: transform 0.2s;"
                 onmouseover="this.style.transform='translateY(-5px)'" 
                 onmouseout="this.style.transform='translateY(0)'">
                <h2 style="margin: 0; font-size: 36px;">🎸</h2>
                <h3 style="margin: 10px 0 0 0;">Tours</h3>
            </div>
        </a>

        <a href="{{ url_for('equipment.scan') }}" style="text-decoration: none; color: inherit;">
            <div style="background: #ffc107; color: white; padding: 30px; border-radius: 10px; text-align: center; transition: transform 0.2s;"
                 onmouseover="this.style.transform='translateY(-5px)'" 
                 onmouseout="this.style.transform='translateY(0)'">
                <h2 style="margin: 0; font-size: 36px;">📱</h2>
                <h3 style="margin: 10px 0 0 0;">Escanear</h3>
            </div>
        </a>

        {% if current_user.role == 'admin' %}
        <a href="{{ url_for('company.settings') }}" style="text-decoration: none; color: inherit;">
            <div style="background: #17a2b8; color: white; padding: 30px; border-radius: 10px; text-align: center; transition: transform 0.2s;"
                 onmouseover="this.style.transform='translateY(-5px)'" 
                 onmouseout="this.style.transform='translateY(0)'">
                <h2 style="margin: 0; font-size: 36px;">⚙️</h2>
                <h3 style="margin: 10px 0 0 0;">Configurações</h3>
            </div>
        </a>
        {% endif %}
    </div>
</div>

<style>
@media (max-width: 768px) {
    div[style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
    }
}
</style>
{% endblock %}
